name: build-win10-installer

# 为什么冒烟测试放在 CI 而不是本地：NSIS 安装包是 GUI 子系统程序，
# 需要在能启动 GUI 进程的桌面会话里才能真正装一遍。CI 的 windows runner
# 正好合适，而且每次改动都重新验证一次，比人肉点一遍可靠。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: 单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 跑测试
        run: python -m unittest discover -s tests -t . -v

  installer:
    name: 构建并验证 Win10 安装包
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller 与 NSIS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0"
          choco install nsis -y --no-progress

      - name: 构建 exe 与安装包
        shell: pwsh
        run: |
          $mk = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path $mk)) { $mk = "C:\Program Files\NSIS" }
          .\build_win10.ps1 -Python (Get-Command python).Source -NsisPath $mk

      - name: 冒烟测试（静默安装 → 校验 → 卸载）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\*setup.exe | Select-Object -First 1
          if (-not $setup) { throw "没有生成安装包" }
          Write-Host "安装包：$($setup.Name)  $([math]::Round($setup.Length/1MB,2)) MB"

          $target = Join-Path $env:ProgramFiles 'EVE Update Accelerator'
          Write-Host "静默安装 → $target"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安装程序退出码 $($p.ExitCode)" }

          foreach ($f in 'eve-update-accelerator.exe','eve-update-accelerator-gui.exe','Uninstall.exe','_internal') {
            if (-not (Test-Path (Join-Path $target $f))) { throw "安装后缺少 $f" }
          }
          Write-Host "文件齐全（$((Get-ChildItem $target -Recurse -File).Count) 个）"

          $ver = & (Join-Path $target 'eve-update-accelerator.exe') --version
          Write-Host "CLI 版本：$ver"
          if ($ver -notmatch '1\.3\.0') { throw "版本号不符：$ver" }

          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EveUpdateAccelerator'
          if (-not (Test-Path $key)) { throw "控制面板卸载项缺失" }
          $info = Get-ItemProperty $key
          Write-Host "卸载项：$($info.DisplayName) / $($info.DisplayVersion)"
          if (-not $info.DisplayIcon) { throw "DisplayIcon 缺失" }

          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\EVE 更新加速器'
          if (-not (Test-Path $startMenu)) { throw "开始菜单项缺失" }

          Write-Host "静默卸载"
          $u = Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "卸载退出码 $($u.ExitCode)" }
          Start-Sleep -Seconds 3

          if (Test-Path $target) { throw "卸载后目录仍然存在：$target" }
          if (Test-Path $key) { throw "卸载后注册表项仍然存在" }
          if (Test-Path $startMenu) { throw "卸载后开始菜单项仍然存在" }
          Write-Host "卸载干净" -ForegroundColor Green

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: eve-update-accelerator-win10-installer
          path: dist/*setup.exe
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eve-update-accelerator-win10-installer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*setup.exe
          generate_release_notes: true
