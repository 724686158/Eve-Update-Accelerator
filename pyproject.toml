[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-update-accelerator"
version = "1.3.0"
description = "Speed up EVE Online client updates on Windows and macOS by picking a CDN endpoint that actually works"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mengzicheng", email = "724686158@qq.com" }]
keywords = ["eve-online", "cdn", "hosts", "accelerator", "windows", "macos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = []          # 零第三方依赖：只用标准库

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/724686158/Eve-Update-Accelerator"
Issues = "https://github.com/724686158/Eve-Update-Accelerator/issues"

[project.scripts]
eve-update-accelerator = "eveupdate.cli:main"

[project.gui-scripts]
eve-update-accelerator-gui = "eveupdate.gui:run_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
